<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="合集阅读 — 连续阅读系列文章" />
    <title>Series · Jay's Blog</title>
    <link rel="icon" href="resource/lemt.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- Markdown 解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link
        id="highlight-theme"
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/github.min.css"
      />
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/common.min.js"></script>
  </head>
  <body>
    <!-- 页面加载动画 -->
    <div id="page-loader" class="page-loader">
      <span class="loader-mark">NLOB</span>
    </div>

    <!-- 阅读进度条 -->
    <div id="reading-progress" class="reading-progress"></div>

    <!-- 回到顶部 -->
    <button id="back-to-top" class="back-to-top" aria-label="Back to top">↑</button>

    <header id="site-header" class="header">
      <div class="container">
        <h1 class="logo">
          <a href="index.html">Jay的技术博客</a>
        </h1>
        <nav class="nav">
          <a href="index.html" data-page="home">首页 / Home</a>
          <a href="collection.html" class="active" data-page="collection">合集 / Series</a>
          <a href="resource.html" data-page="resource">资源 / Links</a>
          <a href="index.html#about-popup">关于 / About</a>
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">☀</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="collection-read-section">
        <div class="container">
          <div class="collection-read-layout">
            <!-- 左侧：合集文章目录 -->
            <aside class="cr-sidebar" id="cr-sidebar">
              <div class="cr-sidebar-header">
                <span id="cr-collection-name">合集</span>
                <a href="collection.html" class="cr-back-link">← 返回</a>
              </div>
              <ul id="cr-article-list" class="cr-article-list">
                <li class="loading">Loading...</li>
              </ul>
            </aside>

            <!-- 中间：文章正文 -->
            <main class="cr-content">
              <div id="cr-content-container">
                <div class="loading">Select an article to read</div>
              </div>
              <div class="cr-nav">
                <a href="collection.html" class="btn">
                  <span class="arrow">←</span>
                  <span>返回合集 / Back to Series</span>
                </a>
              </div>
            </main>

            <!-- 右侧：标题大纲 -->
            <nav class="toc-sidebar" id="cr-toc">
              <div class="toc-header">目录</div>
              <ul id="cr-toc-list" class="toc-list"></ul>
            </nav>
          </div>
        </div>
      </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
      <div class="container">
        <p class="footer-text">
          © <span class="accent">Jay's Blog</span> · Powered by Nlob
        </p>
        <div class="footer-links">
          <a href="https://github.com/RechardJay/Nlob" target="_blank" rel="noopener">GitHub</a>
          <a href="blogs/index.json">Index</a>
          <a href="#top">Top ↑</a>
        </div>
      </div>
    </footer>

    <script src="js/markdown-loader.js"></script>
    <script src="js/collection-read.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
