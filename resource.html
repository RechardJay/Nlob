<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="精选资源与链接 — 工具、文档、学习路径推荐" />
    <title>Resources · Jay's Blog</title>
    <link rel="icon" href="resource/lemt.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- 页面加载动画 -->
    <div id="page-loader" class="page-loader">
      <span class="loader-mark">NLOB</span>
    </div>

    <!-- 阅读进度条 -->
    <div id="reading-progress" class="reading-progress"></div>

    <!-- 回到顶部 -->
    <button id="back-to-top" class="back-to-top" aria-label="Back to top">↑</button>

    <header id="site-header" class="header">
      <div class="container">
        <h1 class="logo">
          <a href="index.html">Jay的技术博客</a>
        </h1>
        <nav class="nav">
          <a href="index.html" data-page="home">首页 / Home</a>
          <a href="collection.html" data-page="collection">合集 / Series</a>
          <a href="resource.html" class="active" data-page="resource">资源 / Links</a>
          <a href="#about-popup">关于 / About</a>
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">☀</button>
        </nav>
      </div>
    </header>

    <!-- 关于弹窗 -->
    <div id="about-popup" class="popup">
      <div class="popup-content">
        <h3>About</h3>
        <ul>
          <li>
            <a href="https://github.com/RechardJay" target="_blank" rel="noopener">Jay's GitHub</a>
          </li>
          <li>
            <a href="https://www.cnblogs.com/jay2home" target="_blank" rel="noopener">博客园 / Cnblogs</a>
          </li>
          <li>
            <a href="https://juejin.cn/user/781101661173600" target="_blank" rel="noopener">掘金 / Juejin</a>
          </li>
        </ul>
        <a href="#" class="close-btn">← Close</a>
      </div>
    </div>

    <main>
      <section class="collection-section">
        <div class="container">
          <!-- Resource Hero -->
          <div class="collection-hero reveal">
            <h1>精选 <span class="italic">资源</span></h1>
            <p>有趣、有用</p>
          </div>

          <div id="resource-grid" class="resource-grid">
            <div class="loading">Compiling the references</div>
          </div>
        </div>
      </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
      <div class="container">
        <p class="footer-text">
          © <span class="accent">Jay's Blog</span> · Powered by Nlob
        </p>
        <div class="footer-links">
          <a href="https://github.com/RechardJay/Nlob" target="_blank" rel="noopener">GitHub</a>
          <a href="blogs/index.json">Index</a>
        </div>
      </div>
    </footer>

    <script src="res/linkResources.js"></script>
    <script src="js/app.js"></script>
    <script>
      // 动态生成资源卡片
      document.addEventListener('DOMContentLoaded', function () {
        if (typeof linkResourcesData !== 'undefined') {
          const grid = document.getElementById('resource-grid');
          grid.innerHTML = '';

          linkResourcesData.forEach((category, idx) => {
            const card = document.createElement('section');
            card.className = 'resource-card reveal is-visible';
            card.style.transitionDelay = (idx * 0.08) + 's';

            const title = document.createElement('h3');
            title.textContent = category.title;
            card.appendChild(title);

            const ul = document.createElement('ul');
            ul.className = 'resource-list';

            category.list.forEach(item => {
              const li = document.createElement('li');
              const a = document.createElement('a');
              a.href = item.link;

              // 判断是否为外链
              if (item.link.startsWith('http')) {
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
              }

              // 显示文本（title）
              const textSpan = document.createElement('span');
              textSpan.textContent = item.title || item.link;
              a.appendChild(textSpan);

              // 悬浮提示（description）
              if (item.description) {
                a.dataset.tip = item.description;
              }

              // 箭头
              const arrow = document.createElement('span');
              arrow.className = 'link-arrow';
              arrow.textContent = '↗';
              a.appendChild(arrow);

              li.appendChild(a);
              ul.appendChild(li);
            });

            card.appendChild(ul);
            grid.appendChild(card);
          });
        }
      });
    </script>
  </body>
</html>
