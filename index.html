<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jay's Blog</title>
    <link rel="icon" href="resource\lemt.jpg" type="jpg" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- Markdown 解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 代码高亮 -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/github-dark.min.css"
    />
    <style>
      .popup {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
      }

      .popup-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 30px;
        border-radius: 5px;
        max-width: 500px;
        width: 90%;
        color: #333; /* 确保文字颜色可见 */
      }

      /* 当URL哈希匹配时显示弹窗 */
      .popup:target {
        display: block;
      }

      .close-btn {
        display: inline-block;
        margin-top: 15px;
        padding: 8px 15px;
        background: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1 class="logo">Jay的技术博客</h1>
        <nav class="nav">
          <a href="index.html">首页</a>
          <a href="#about-popup">关于</a>
        </nav>
      </div>
    </header>
    <div id="about-popup" class="popup">
      <div class="popup-content">
        <h3>关于</h3>
        <ul>
          <li>
            <a href="https://github.com/RechardJay">Jay's github</a>
          </li>
          <li>
            <a href="https://www.cnblogs.com/jay2home">博客园</a>
          </li>
          <li>
            <a href="https://juejin.cn/user/781101661173600">掘金</a>
          </li>
        </ul>
        <a href="#" class="close-btn">关闭</a>
      </div>
    </div>
    <main class="container">
      <section class="hero">
        <h1>欢迎来到 Jay's Blog</h1>
        <h2>分享技术思考和学习笔记</h2>
        <p>这里或许有些有用的东西</p>
      </section>

      <section class="blog-list">
        <h3>最新文章</h3>
        <div id="blog-list-container">
          <!-- 博客列表将通过JS动态加载 -->
          <div class="loading">加载中...</div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy;Nlob 基于 GitHub Pages+Notion</p>
      </div>
    </footer>

    <script src="js/markdown-loader.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
